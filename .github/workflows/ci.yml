name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No `dart format --set-exit-if-changed` gate on purpose. The committed code
      # was formatted with an older Dart formatter, and the 3.x "tall style" would
      # reformat ~60 of the ~102 hand-written files. That is a deliberate, separate
      # change to make, not something CI should fail on from day one.
      - name: Analyze
        run: flutter analyze

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
